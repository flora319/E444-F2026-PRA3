{% extends "base.html" %}

{% block title %}Flasky - Chatbot{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Hi {{ name }}! Chat with the PRA3 bot</h1>
    <p>Try "My name is Alice", then "What is my name?"</p>
</div>

<div id="chat-log" class="well" style="height: 300px; overflow-y: auto;"></div>

<form id="chat-form">
    <div class="input-group">
        <input type="text" id="message" class="form-control"
               placeholder="Type a message..." autocomplete="off" required>
        <span class="input-group-btn">
            <button type="submit" class="btn btn-primary">Send</button>
        </span>
    </div>
</form>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
function addLine(sender, text) {
    var line = document.createElement('p');
    var who = document.createElement('strong');
    who.textContent = sender + ': ';
    line.appendChild(who);
    line.appendChild(document.createTextNode(text));
    var log = document.getElementById('chat-log');
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
}

document.getElementById('chat-form').addEventListener('submit', function (event) {
    event.preventDefault();  // send with fetch instead of reloading the page
    var input = document.getElementById('message');
    var message = input.value;
    addLine('You', message);
    input.value = '';

    // The browser sends the session cookie with this request automatically
    fetch('{{ url_for("chat") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: message})
    })
        .then(function (response) { return response.json(); })
        .then(function (data) { addLine('Bot', data.reply); });
});
</script>
{% endblock %}
